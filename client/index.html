<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Foodie AI — Your Personal Culinary Companion</title>
<meta name="theme-color" content="#e85d2f">
<meta name="description" content="AI-powered culinary companion — recipes from your fridge">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<!-- ── NAV ─────────────────────────────────────────────────────────────── -->
<nav id="main-nav">
  <div class="container nav-row">
    <a href="#/" class="logo" data-link>
      <span class="logo-mark">F</span>
      <span>Foodie<span class="accent">AI</span></span>
    </a>

    <div class="nav-links" id="app-nav-links">
      <!-- injected by app.js based on auth state -->
    </div>

    <div class="nav-actions" id="nav-actions">
      <!-- injected by app.js -->
    </div>
  </div>
</nav>

<!-- ── APP SHELL ───────────────────────────────────────────────────────── -->
<main id="app">
  <div class="page-loader" id="page-loader">
    <div class="spinner"></div>
  </div>
</main>

<!-- ── TOAST ──────────────────────────────────────────────────────────── -->
<div id="toast-container"></div>

<!-- ── MODAL ──────────────────────────────────────────────────────────── -->
<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal-box" id="modal-box"></div>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
  }

  // PWA install banner
  let _deferredInstall = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    _deferredInstall = e;
    const banner = document.createElement('div');
    banner.className = 'install-banner';
    banner.id = 'install-banner';
    banner.innerHTML = `
      <div style="flex:1">
        <h4>Install Foodie AI</h4>
        <p>Add to home screen for the full app experience.</p>
      </div>
      <button class="btn btn-sm btn-accent" onclick="installPWA()">Install</button>
      <button class="install-close" onclick="document.getElementById('install-banner').remove()">✕</button>`;
    document.body.appendChild(banner);
  });

  window.installPWA = async () => {
    if (!_deferredInstall) return;
    _deferredInstall.prompt();
    const { outcome } = await _deferredInstall.userChoice;
    if (outcome === 'accepted') document.getElementById('install-banner')?.remove();
    _deferredInstall = null;
  };
</script>
</body>
</html>
