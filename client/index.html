<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Foodie AI — Your Personal Culinary Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<!-- ── NAV ─────────────────────────────────────────────────────────────── -->
<nav id="main-nav">
  <div class="container nav-row">
    <a href="#/" class="logo" data-link>
      <span class="logo-mark">F</span>
      <span>Foodie<span class="accent">AI</span></span>
    </a>

    <div class="nav-links" id="app-nav-links">
      <!-- injected by app.js based on auth state -->
    </div>

    <div class="nav-actions" id="nav-actions">
      <!-- injected by app.js -->
    </div>
  </div>
</nav>

<!-- ── APP SHELL ───────────────────────────────────────────────────────── -->
<main id="app">
  <div class="page-loader" id="page-loader">
    <div class="spinner"></div>
  </div>
</main>

<!-- ── TOAST ──────────────────────────────────────────────────────────── -->
<div id="toast-container"></div>

<!-- ── MODAL ──────────────────────────────────────────────────────────── -->
<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal-box" id="modal-box"></div>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
